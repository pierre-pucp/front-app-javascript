<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operadora Móvil - Gestion des Clients</title>
</head>
<body>
    <header>
        <h1>Gestion des Clients - Operadora Móvil</h1>
        <p id="contadorClientes">Nombre de clientes : 0</p>
    </header>

    <div id="alertaMensaje"></div>

    <section>
        <h2>Nuevo cliente</h2>
        <form id="formCliente" onsubmit="return validarForm()">
            <label for="inputNombre">Nombre del cliente</label>
            <input id="inputNombre" type="text">

            <label for="inputPlan">Tipo de plan</label>
            <select id="inputPlan">
                <option value="Prepago">Prepago</option>
                <option value="Postpago">Postpago</option>
                <option value="Corporativo">Corporativo</option>
            </select>

            <button type="submit">Añadir</button>
        </form>
    </section>

    <section>
        <h2>Buscar por ID</h2>
        <label for="inputBuscar">ID del cliente</label>
        <input type="text" id="inputBuscar">
        <button type="button" id="btnBuscar">Buscar</button>
    </section>

    <div id="alertaTabla"></div>

    <h2>Tabla de clientes</h2>
    <table id="tablaClientes">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Plan</th>
                <th>Status</th>
                <th>Actiones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <tr>
                <td>1</td>
                <td>Carlos Pérez</td>
                <td>Postpago</td>
                <td>Activo</td>
                <td><button class="btn-eliminar" data-id="1">Eliminar</button></td>
            </tr>
        </tbody>
    </table>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
